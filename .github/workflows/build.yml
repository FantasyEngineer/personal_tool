name: build

# Builds a macOS .app and a Windows .exe with PyInstaller on native runners.
# - Push to `main` (or manual run): produces downloadable artifacts.
# - Push a tag like `v1.0.0`: additionally publishes a GitHub Release with both zips.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Toolbox-macos
            zip_name: Toolbox-macos.zip
          - os: windows-latest
            artifact_name: Toolbox-windows
            zip_name: Toolbox-windows.zip

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm toolbox.spec

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses to load unsigned Mach-O, which surfaces as
          # "app is damaged". Sign the bundle and all nested binaries ad-hoc.
          APP="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 3 -name 'Toolbox.app' -type d | head -n1)"
          if [ -z "$APP" ]; then echo "Toolbox.app not found under dist/"; ls -R dist; exit 1; fi
          echo "Signing: $APP"
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 3 -name 'Toolbox.app' -type d | head -n1)"
          PARENT="$(dirname "$APP")"
          NAME="$(basename "$APP")"
          ( cd "$PARENT" && ditto -c -k --sequesterRsrc --keepParent "$NAME" "$GITHUB_WORKSPACE/${{ matrix.zip_name }}" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Toolbox -DestinationPath ${{ matrix.zip_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.zip_name }}
          generate_release_notes: true
