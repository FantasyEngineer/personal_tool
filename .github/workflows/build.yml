name: build

# Builds a macOS .app and a Windows .exe with PyInstaller on native runners.
# - Push to `main` (or manual run): produces downloadable artifacts.
# - Push a tag like `v1.0.0`: additionally publishes a GitHub Release, mirrors
#   the installers to a Gitee Release and rewrites version.json, so the running
#   app can detect the update with no manual download/upload step.
# - Windows releases are code-signed through SignPath when the credentials
#   below are configured (see "Signing setup" at the end of this file).
#
# Release flow: bump nothing by hand, just tag and push.
#   git tag v1.0.11 && git push origin v1.0.11

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The SignPath action downloads the unsigned artifact through the API.
  actions: read

env:
  GITEE_OWNER: jimmy_hou
  GITEE_REPO: personal_tool

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Toolbox-macos
            asset_name: Toolbox-macos.zip
          - os: windows-latest
            artifact_name: Toolbox-windows
            asset_name: Toolbox-windows.zip

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      # Empty until the SignPath API token secret is added; signing steps are
      # skipped in that case so ordinary pushes keep working.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 版本号以 git tag 为唯一来源：把 v1.0.11 写进 APP_VERSION，并通过
      # GITHUB_ENV 传给打包步骤（spec 里的 CFBundle 版本号）。非 tag 构建不改动源码。
      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Build version: $VERSION"
          sed -i.bak -E "s/^APP_VERSION = \".*\"/APP_VERSION = \"$VERSION\"/" toolbox.py
          rm -f toolbox.py.bak
          grep -m1 '^APP_VERSION' toolbox.py
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm toolbox.spec

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses to load unsigned Mach-O, which surfaces as
          # "app is damaged". Sign the bundle and all nested binaries ad-hoc.
          APP="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 3 -name 'Toolbox.app' -type d | head -n1)"
          if [ -z "$APP" ]; then echo "Toolbox.app not found under dist/"; ls -R dist; exit 1; fi
          echo "Signing: $APP"
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Signing runs on tags and manual runs only: every request has to be
      # approved in SignPath and counts against the OSS plan's quota.
      - name: Upload unsigned exe (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/Toolbox.exe
          if-no-files-found: error

      - name: Sign with SignPath (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signature (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Filter Toolbox.exe -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "signed exe not found under signed/"; exit 1 }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Status: $($sig.Status) $($sig.StatusMessage)"
          if ($sig.Status -ne 'Valid') { Write-Error "signature is not valid"; exit 1 }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 3 -name 'Toolbox.app' -type d | head -n1)"
          PARENT="$(dirname "$APP")"
          NAME="$(basename "$APP")"
          ( cd "$PARENT" && ditto -c -k --sequesterRsrc --keepParent "$NAME" "$GITHUB_WORKSPACE/${{ matrix.asset_name }}" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use the signed exe when SignPath produced one, else the raw build.
          $signed = Get-ChildItem -Path signed -Filter Toolbox.exe -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          $src = if ($signed) { $signed.FullName } else { 'dist/Toolbox.exe' }
          if (-not (Test-Path $src)) { Write-Error "no Toolbox.exe to package"; exit 1 }
          Write-Host "Packaging $src"
          Compress-Archive -Path $src -DestinationPath ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
          generate_release_notes: true

  sync-to-gitee:
    name: Publish to Gitee and update version.json
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      # fetch-depth 0 才能读到 tag 与历史提交，用于自动生成 changelog。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 由 tag 自动生成 version.json：版本号取自 tag，下载地址指向该 tag 的
      # Gitee Release 资源，changelog 优先用附注 tag 的说明，其次用提交记录。
      - name: Generate version.json
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/download/$TAG"

          TAG_TYPE="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          if [ "$TAG_TYPE" = "tag" ]; then
            CHANGELOG="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^[[:space:]]*$/d')"
          else
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              CHANGELOG="$(git log --no-merges --pretty=format:'- %s' "$PREV..$TAG")"
            else
              CHANGELOG="$(git log --no-merges --pretty=format:'- %s' -n 10 "$TAG")"
            fi
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="版本更新"

          python3 - "$VERSION" "$CHANGELOG" "$BASE" <<'PY'
          import json
          import pathlib
          import sys

          version, changelog, base = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "version": version,
              "mac_url": f"{base}/Toolbox-macos.zip",
              "win_url": f"{base}/Toolbox-windows.zip",
              "changelog": changelog,
          }
          text = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          pathlib.Path("version.json").write_text(text, encoding="utf-8")
          sys.stdout.write(text)
          PY

      - name: Create Gitee Release and upload assets
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          AUTH_HEADER="Authorization: token $GITEE_TOKEN"

          # 1. 复用或创建 Release
          RELEASE_ID="$(curl -fsS -H "$AUTH_HEADER" "$API/releases/tags/$TAG" | jq -r '.id // empty' || true)"
          if [ -z "$RELEASE_ID" ]; then
            echo "Release $TAG not found, creating..."
            PAYLOAD="$(jq -n --arg t "$TAG" '{
              tag_name: $t, name: $t,
              body: "Automatically synced from GitHub Actions",
              target_commitish: "main", prerelease: false }')"
            RESPONSE="$(curl -sS -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
              -d "$PAYLOAD" "$API/releases")" || true
            RELEASE_ID="$(echo "$RESPONSE" | jq -r '.id // empty' || true)"
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::failed to create Gitee release: $RESPONSE"
              exit 1
            fi
          fi
          echo "Release id: $RELEASE_ID"

          # 2. 逐个上传；失败会显式报错并让 job 失败，不再静默跳过。
          upload_asset() {
            local name="$1"
            local path="artifacts/${name%.zip}/$name"
            if [ ! -f "$path" ]; then
              echo "::error::artifact not found: $path"
              ls -R artifacts
              return 1
            fi
            echo "::group::Upload $name ($(du -h "$path" | cut -f1))"

            # 重跑同一 tag 时，先删掉同名旧附件，否则 Gitee 会报"文件已存在"。
            local old_ids
            old_ids="$(curl -fsS -H "$AUTH_HEADER" \
              "$API/releases/$RELEASE_ID/attach_files?per_page=100" \
              | jq -r --arg n "$name" '.. | objects | select(.name? == $n) | .id' 2>/dev/null || true)"
            for id in $old_ids; do
              echo "Deleting existing attachment $id ($name)"
              curl -sS -X DELETE -H "$AUTH_HEADER" \
                "$API/releases/$RELEASE_ID/attach_files/$id" >/dev/null || true
            done

            local i code body response
            for i in 1 2 3; do
              echo "Attempt $i..."
              response="$(curl -sS -w '\n%{http_code}' -X POST \
                -H "$AUTH_HEADER" \
                -F "file=@$path" \
                --connect-timeout 30 --max-time 1800 \
                "$API/releases/$RELEASE_ID/attach_files")" || true
              code="$(printf '%s' "$response" | tail -n1)"
              body="$(printf '%s' "$response" | sed '$d')"
              echo "HTTP $code: $body"
              if [ "$code" = "201" ] || [ "$code" = "200" ]; then
                echo "Uploaded $name"
                echo "::endgroup::"
                return 0
              fi
              echo "Retrying in 15s..."
              sleep 15
            done
            echo "::endgroup::"
            echo "::error::failed to upload $name after retries (Gitee 单附件上限 100MB)"
            return 1
          }

          status=0
          upload_asset Toolbox-macos.zip || status=1
          upload_asset Toolbox-windows.zip || status=1
          exit $status

      # 把 version.json 提交到 Gitee 仓库 main 分支 —— 应用正是从这里读取更新信息。
      - name: Publish version.json to Gitee
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          AUTH_HEADER="Authorization: token $GITEE_TOKEN"
          CONTENT="$(base64 -w0 version.json)"
          SHA="$(curl -fsS -H "$AUTH_HEADER" "$API/contents/version.json?ref=main" \
            | jq -r '.sha // empty' || true)"
          MESSAGE="chore: update version.json for $TAG"

          if [ -n "$SHA" ]; then
            PAYLOAD="$(jq -n --arg c "$CONTENT" --arg s "$SHA" --arg m "$MESSAGE" \
              '{content: $c, sha: $s, message: $m, branch: "main"}')"
            METHOD="PUT"
          else
            PAYLOAD="$(jq -n --arg c "$CONTENT" --arg m "$MESSAGE" \
              '{content: $c, message: $m, branch: "main"}')"
            METHOD="POST"
          fi

          curl -fsS -X "$METHOD" -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$API/contents/version.json" >/dev/null
          echo "version.json published to Gitee ($TAG)"

      # 顺手把仓库里的 version.json 也同步一份，避免两边对不上。
      # 加 [skip ci] 防止这次提交再触发一轮构建。
      - name: Publish version.json to GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}/contents/version.json"
          CONTENT="$(base64 -w0 version.json)"
          SHA="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API?ref=main" | jq -r '.sha // empty' || true)"

          PAYLOAD="$(jq -n --arg c "$CONTENT" --arg s "$SHA" \
            --arg m "chore: update version.json for $TAG [skip ci]" \
            '{message: $m, content: $c, sha: $s, branch: "main"}')"

          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$API" >/dev/null
          echo "version.json published to GitHub ($TAG)"

# Signing setup (one-time, done in the GitHub UI):
#   Secret   SIGNPATH_API_TOKEN            API token created in SignPath
#   Secret   GITEE_TOKEN                   Gitee 私人令牌（勾选 projects 权限）
#   Variable SIGNPATH_ORGANIZATION_ID      SignPath organization id
#   Variable SIGNPATH_PROJECT_SLUG         e.g. personal-tool
#   Variable SIGNPATH_SIGNING_POLICY_SLUG  e.g. release-signing
# Artifact configuration is left to the project default configured in SignPath.
